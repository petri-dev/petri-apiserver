apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: petri-apiserver-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["default"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: petri-apiserver-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: petri-apiserver-namespace-reader
subjects:
  - kind: ServiceAccount
    name: petri-apiserver
    namespace: default
